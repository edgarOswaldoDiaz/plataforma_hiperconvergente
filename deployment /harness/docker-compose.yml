name: harness-oss
services:
  harness:
    image: ${HARNESS_IMAGE:-harness/harness:3.3.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3000"
      - "127.0.0.1:3022:3022"
    volumes: [harness-data:/data]
    networks: [harness-net]
    security_opt: ["no-new-privileges:true"]
    # Intentionally no /var/run/docker.sock mount. Configure an isolated remote runner for builds.

volumes:
  harness-data:
networks:
  harness-net:
    driver: bridge
