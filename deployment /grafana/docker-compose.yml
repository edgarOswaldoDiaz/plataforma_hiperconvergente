name: grafana-oss
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GRAFANA_DB_NAME:-grafana}
      POSTGRES_USER: ${GRAFANA_DB_USER:-grafana}
      POSTGRES_PASSWORD: ${GRAFANA_DB_PASSWORD:?Set GRAFANA_DB_PASSWORD in .env}
    volumes: [grafana-db:/var/lib/postgresql/data]
    networks: [grafana-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: db:5432
      GF_DATABASE_NAME: ${GRAFANA_DB_NAME:-grafana}
      GF_DATABASE_USER: ${GRAFANA_DB_USER:-grafana}
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_COOKIE_HTTPONLY: "true"
    ports: ["127.0.0.1:3001:3000"]
    volumes: [grafana-data:/var/lib/grafana]
    networks: [grafana-net]
    security_opt: ["no-new-privileges:true"]

volumes:
  grafana-db:
  grafana-data:
networks:
  grafana-net:
    driver: bridge
