name: trino-coordinator
services:
  trino:
    image: trinodb/trino:484
    restart: unless-stopped
    ports: ["127.0.0.1:18081:8080"]
    volumes:
      - ./etc:/etc/trino:ro
    networks: [trino-net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  trino-net:
    driver: bridge
