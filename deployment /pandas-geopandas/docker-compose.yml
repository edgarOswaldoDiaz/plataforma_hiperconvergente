name: pandas-geopandas-tools
services:
  python-gis:
    build: .
    profiles: ["tools"]
    working_dir: /workspace
    command: ["python", "-c", "import pandas, geopandas; print('pandas', pandas.__version__, '| geopandas', geopandas.__version__)"]
    volumes: [./workspace:/workspace]
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
